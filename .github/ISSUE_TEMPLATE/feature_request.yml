name: Feature request
description: Suggest an improvement, new capability, or change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. This project is evidence-first: proposals that would let machine output, unreviewed predictions, or unregistered coordinates masquerade as biology are out of scope. Keep that boundary in mind.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the motivation, not just the solution.
      placeholder: It is currently hard to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you set them aside.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to related issues, docs, or evidence records.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This request preserves the project's evidence and provenance boundaries.
          required: true

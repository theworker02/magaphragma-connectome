AWSTemplateFormatVersion: "2010-09-09"
# DECOMMISSIONED for Affinity production — do not deploy.
# Production cloud is Vast.ai (docs/VAST_AFFINITY.md). This template is historical evidence only.
Description: >
  [HISTORICAL/DECOMMISSIONED] Magaphragma S7 affinity FAST_002 GPU worker fleet.
  DynamoDB claim table + S3 artifacts + ASG of g6.xlarge (1x L4) Spot-preferred workers.
  Does NOT open MV-SEG / synapses / graph biological gates.
  DO NOT DEPLOY — use tools/affinity_vast.py instead.

Parameters:
  DesiredCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 32
    Description: Number of GPU workers (each 1x L4). ~10–12 needed for ~3-day goal after FAST_002. Keep 0 until quota+cost OK.
  InstanceType:
    Type: String
    Default: g6.xlarge
    AllowedValues: [g6.xlarge, g5.xlarge, g6.2xlarge]
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair for emergency SSH (prefer SSM). Leave empty for SSM-only.
  GpuAmiId:
    Type: String
    Default: ami-0fa78451e16d6a8c5
    Description: Deep Learning OSS Nvidia Driver AMI GPU PyTorch (Ubuntu) us-east-1 — override if stale.
  CheckpointS3Uri:
    Type: String
    Default: ""
    Description: s3://bucket/key to C_PATCH_20_64_64 checkpoint-step10.pt (set before scaling workers)
  ChunksIndexS3Uri:
    Type: String
    Default: ""
    Description: s3://bucket/key to chunks.json (set before scaling workers)
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  VpcId:
    Type: AWS::EC2::VPC::Id

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ClaimTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chunk_id
          AttributeType: S
      KeySchema:
        - AttributeName: chunk_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S7WorkerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              # Checkpoint / chunks may live in a separate bucket; tighten after first deploy.
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt ClaimTable.Arn

  WorkerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: S7 workers egress-only (DVID fetch + S3)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref GpuAmiId
        InstanceType: !Ref InstanceType
        KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
        IamInstanceProfile:
          Arn: !GetAtt WorkerInstanceProfile.Arn
        SecurityGroupIds: [!Ref WorkerSecurityGroup]
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 200
              VolumeType: gp3
              Encrypted: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            export S7_CLAIM_BACKEND=dynamodb
            export S7_DDB_TABLE=${ClaimTable}
            export S7_ARTIFACT_BUCKET=${ArtifactBucket}
            export S7_CHECKPOINT_S3=${CheckpointS3Uri}
            export S7_CHUNKS_S3=${ChunksIndexS3Uri}
            export S7_CHECKPOINT=/opt/s7/checkpoint.pt
            export S7_CHUNKS=/opt/s7/local_research_build/phase5c-production/chunks.json
            export S7_OUT=/opt/s7/experiments/phase6e/AFFINITY-FULLVOL-S7-001
            export S7_INFER_BACKEND=compile
            export S7_TILE_BATCH=32
            export CUDA_VISIBLE_DEVICES=0
            export AWS_DEFAULT_REGION=us-east-1
            export AWS_REGION=us-east-1
            export S7_WORKER_ID="aws-$(TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600'); curl -sH \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/instance-id || echo unknown)"
            mkdir -p /opt/s7 /var/log/s7
            echo "S7 worker boot table=${ClaimTable} bucket=${ArtifactBucket}" | tee /var/log/s7/worker-ready.txt
            if aws s3 ls "s3://${ArtifactBucket}/release/worker.tgz" >/dev/null 2>&1; then
              aws s3 cp "s3://${ArtifactBucket}/release/worker.tgz" /tmp/worker.tgz
              tar -xzf /tmp/worker.tgz -C /opt/s7
              aws s3 cp "$S7_CHECKPOINT_S3" /opt/s7/checkpoint.pt
              # chunks.json already in tarball; refresh if separate URI provided
              if [[ -n "$S7_CHUNKS_S3" ]]; then
                aws s3 cp "$S7_CHUNKS_S3" /opt/s7/local_research_build/phase5c-production/chunks.json
              fi
              cd /opt/s7
              # DLAMI ships torch+numpy under /opt/pytorch; system python3 has neither.
              export PATH=/opt/pytorch/bin:$PATH
              /opt/pytorch/bin/pip install -q tifffile boto3
              nohup /opt/pytorch/bin/python -u tools/run_affinity_fullvol_s7_fast_worker.py \
                --claim --loop --batch-size 32 --max-chunks 128 --contract FAST_003 --infer-backend compile \
                >> /var/log/s7/worker.log 2>&1 &
            else
              echo "WAITING_FOR_RELEASE_TGZ" | tee -a /var/log/s7/worker-ready.txt
            fi

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref VpcSubnetIds
      DesiredCapacity: !Ref DesiredCapacity
      MinSize: 0
      MaxSize: 32
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref LaunchTemplate
            Version: !GetAtt LaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: g6.xlarge
            - InstanceType: g5.xlarge
        InstancesDistribution:
          OnDemandBaseCapacity: 2
          OnDemandPercentageAboveBaseCapacity: 100
          SpotAllocationStrategy: price-capacity-optimized
      Tags:
        - Key: Name
          Value: magaphragma-s7-fast002
          PropagateAtLaunch: true
        - Key: Project
          Value: magaphragma-connectome
          PropagateAtLaunch: true

Outputs:
  ClaimTableName:
    Value: !Ref ClaimTable
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  LaunchTemplateId:
    Value: !Ref LaunchTemplate
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
